name: 更新匯率資料

on:
  schedule:
    # 臺北時間 週一～週五 08:07～17:37，每 30 分鐘（臺銀營業時間內牌告較常變動）
    - cron: '7,37 0-9 * * 1-5'
    # 其餘時段每天補抓幾次（臺北時間 20:17、00:17、06:17）
    - cron: '17 12,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取匯率
        run: node scripts/fetch-rates.mjs

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "匯率無變動"
            exit 0
          fi
          git commit -m "data: 更新匯率 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
